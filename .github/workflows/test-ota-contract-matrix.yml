name: 'Test: Ota contract matrix'

on:
  workflow_dispatch:
    inputs:
      ota_git_rev:
        description: Exact unreleased Ota git revision to install for this matrix run
        required: false
        default: 08c270351c9870c82a39899161388bb250ad23c4
  pull_request:
    paths:
      - 'ota.yaml'
      - '.github/workflows/test-ota-contract-matrix.yml'
  push:
    paths:
      - 'ota.yaml'
      - '.github/workflows/test-ota-contract-matrix.yml'

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: '1'
  OTA_GIT_REV: ${{ github.event.inputs.ota_git_rev || '08c270351c9870c82a39899161388bb250ad23c4' }}

jobs:
  native:
    name: Ota Contract Matrix (Native - ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-bash
            os: ubuntu-latest
            run_shell: bash
            full_backend: true
            allow_packaged_quickstart_failure: true
          - name: macos-bash
            os: macos-latest
            run_shell: bash
            full_backend: false
            allow_packaged_quickstart_failure: true
          - name: windows-pwsh
            os: windows-latest
            run_shell: pwsh
            full_backend: false
            allow_packaged_quickstart_failure: true
          - name: windows-git-bash
            os: windows-latest
            run_shell: bash
            full_backend: false
            allow_packaged_quickstart_failure: true

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ota (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV="${OTA_GIT_REV}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_GIT_REV = "${env:OTA_GIT_REV}"
          & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify ota install [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota --version

      - name: Verify ota install [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          ota --version

      - name: Validate contract and inspect workflows [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota validate .
          ota tasks --workflow app .
          ota tasks --workflow backend .
          ota tasks --workflow frontend .
          ota tasks --workflow ai .
          ota tasks --workflow runtime .
          ota tasks --workflow instant .
          ota tasks --workflow docker .
          ota execution topology --json .

      - name: Validate contract and inspect workflows [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          ota validate .
          ota tasks --workflow app .
          ota tasks --workflow backend .
          ota tasks --workflow frontend .
          ota tasks --workflow ai .
          ota tasks --workflow runtime .
          ota tasks --workflow instant .
          ota tasks --workflow docker .
          ota execution topology --json .

      - name: Dry-run all non-internal tasks (native coverage lane)
        if: matrix.full_backend && matrix.run_shell == 'bash'
        shell: bash
        run: |
          set -euo pipefail
          ota tasks --json . > .ota-tasks-all.json
          jq -r '.tasks[] | select(.kind != "container") | .name' .ota-tasks-all.json > .ota-task-names.txt
          while IFS= read -r task_name; do
            echo ">>> [dry-run] ${task_name}"
            ota run "${task_name}" --dry-run --json .
          done < .ota-task-names.txt

      - name: Proof packaged quickstart workflow
        id: instant
        continue-on-error: ${{ matrix.allow_packaged_quickstart_failure }}
        uses: ota-run/action@v1
        with:
          command: proof
          workflow: instant
          install: never
          comment-pr: false
          artifact-name: ota-proof-instant-${{ matrix.name }}
          output-path: .ota-proof-instant-${{ matrix.name }}.json

      - name: Report packaged quickstart signal
        if: ${{ always() && matrix.allow_packaged_quickstart_failure }}
        shell: bash
        run: |
          outcome='${{ steps.instant.outcome }}'
          if [ "$outcome" = "failure" ]; then
            echo "::warning::Packaged quickstart signal failed on ${{ matrix.name }}; contributor backend workflow remains hard-gated."
          else
            echo "Packaged quickstart signal passed on ${{ matrix.name }}."
          fi

      - name: Proof contributor backend workflow
        if: matrix.full_backend
        uses: ota-run/action@v1
        with:
          command: proof
          workflow: backend
          install: never
          comment-pr: false
          artifact-name: ota-proof-backend-${{ matrix.name }}
          output-path: .ota-proof-backend-${{ matrix.name }}.json

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ota-contract-matrix-${{ matrix.name }}
          path: |
            .ota-proof-instant-${{ matrix.name }}.json
            .ota-proof-backend-${{ matrix.name }}.json
            .ota/
          retention-days: 7

  docker-linux:
    name: Ota Contract Matrix (Container - ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ota (Unix)
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV="${OTA_GIT_REV}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Docker and ota
        shell: bash
        run: |
          docker version
          ota --version

      - name: Proof packaged Docker workflow
        uses: ota-run/action@v1
        with:
          command: proof
          workflow: docker
          install: never
          comment-pr: false
          artifact-name: ota-proof-docker-linux
          output-path: .ota-proof-docker-linux.json

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ota-contract-matrix-docker-linux
          path: |
            .ota-proof-docker-linux.json
            .ota/
          retention-days: 7
